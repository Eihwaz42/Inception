events {
}

http {
    server {
        # NGINX is the only entry point to the infrastructure
        # and accepts HTTPS connections on port 443
        listen 443 ssl;
        server_name llabatut.42.fr;

        # TLS certificate and private key
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Only TLS 1.2 and TLS 1.3 are allowed
        ssl_protocols TLSv1.2 TLSv1.3;

        # WordPress files are stored in the shared volume
        root /var/www/html;
        index index.php index.html;

        # Serve the requested resource if it exists,
        # otherwise forward the request to WordPress
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP files are forwarded to PHP-FPM in the WordPress container
        location ~ \.php$ {
            include fastcgi_params;

            # "wordpress" is resolved through the Docker network
            # and PHP-FPM listens on port 9000
            fastcgi_pass wordpress:9000;

            # Tell PHP-FPM which PHP file must be executed
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
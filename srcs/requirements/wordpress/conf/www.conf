[www]

; User and group used by PHP-FPM processes
user = www-data
group = www-data

; Listen on port 9000 so NGINX can forward PHP requests
; to PHP-FPM through the Docker network
listen = 0.0.0.0:9000

listen.owner = www-data
listen.group = www-data

; Dynamically manage the PHP-FPM worker processes
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Preserve environment variables passed to the container
clear_env = no